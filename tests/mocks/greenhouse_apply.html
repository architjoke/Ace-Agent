<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Greenhouse Apply Mock</title>
</head>
<body>
  <main>
    <h1>Software Engineer</h1>
    <form id="application" aria-label="Job application">
      <label for="first_name">First name</label>
      <input id="first_name" name="job_application[first_name]" autocomplete="given-name" />

      <label for="last_name">Last name</label>
      <input id="last_name" name="job_application[last_name]" autocomplete="family-name" />

      <label for="email">Email</label>
      <input id="email" name="job_application[email]" type="email" autocomplete="email" />

      <label for="phone">Phone</label>
      <input id="phone" name="job_application[phone]" type="tel" autocomplete="tel" />

      <label for="resume">Resume</label>
      <input id="resume" type="file" name="resume" />

      <button type="button" id="submit_app">Submit application</button>
    </form>
  </main>
  <script>
    document.getElementById("submit_app").addEventListener("click", function () {
      document.body.innerHTML = "<main><p>Thank you for applying</p><p>Application submitted</p></main>";
    });
  </script>
</body>
</html>
