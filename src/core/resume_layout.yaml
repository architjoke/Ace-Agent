# Ace visual layout — theme `ace` + volume-driven spacing presets.
# Page margins live in themes/ace/Preamble.j2.typ (not here — RenderCV 2.3
# Typst crash when design.page.*_margin is emitted).
#
# Readable 1-pager: body type + section/bullet gaps. Content selection stays
# JD/track-driven in tailor.py; these presets only control chrome/spacing.

theme: ace

# RenderCV default phone_number_format=national adds India trunk "0"
# (8572855980 → 085728 55980). Use international so resumes show +91 85728…
locale:
  language: en
  phone_number_format: international

page:
  size: a4
  show_page_numbering: false
  show_last_updated_date: false

header:
  vertical_space_between_name_and_connections: 0.28cm
  vertical_space_between_connections_and_first_section: 0.32cm
  use_icons_for_connections: true
  use_urls_as_placeholders_for_connections: true
  make_connections_links: true
  separator_between_connections: "|"
  horizontal_space_between_connections: 0.28cm
  name_font_size: 22pt

# Volume thresholds (highlight bullets across experience+projects)
volume:
  airy_max_bullets: 11
  dense_min_bullets: 16

presets:
  # Open look — fill leftover whitespace on short truthful 1-pagers (must stay ≤1 page).
  airy:
    header:
      vertical_space_between_name_and_connections: 0.32cm
      vertical_space_between_connections_and_first_section: 0.3cm
      name_font_size: 22.5pt
    text:
      font_size: 10.45pt
      leading: 0.66em
    section_titles:
      font_size: 1.28em
      vertical_space_above: 0.46cm
      vertical_space_below: 0.22cm
    entries:
      vertical_space_between_entries: 0.72em
      date_and_location_width: 3.45cm
      horizontal_space_between_columns: 0.12cm
      left_and_right_margin: 0.03cm
    highlights:
      top_margin: 0.18cm
      vertical_space_between_highlights: 0.28cm
      horizontal_space_between_bullet_and_highlight: 0.42em
      left_margin: 0.11cm

  # Default handmade 1-pager — fills A4 with ~1.1cm theme margins.
  balanced:
    header:
      vertical_space_between_name_and_connections: 0.3cm
      vertical_space_between_connections_and_first_section: 0.28cm
      name_font_size: 22pt
    text:
      font_size: 10.4pt
      leading: 0.64em
    section_titles:
      font_size: 1.26em
      vertical_space_above: 0.42cm
      vertical_space_below: 0.2cm
    entries:
      vertical_space_between_entries: 0.65em
      date_and_location_width: 3.4cm
      horizontal_space_between_columns: 0.1cm
      left_and_right_margin: 0.02cm
    highlights:
      top_margin: 0.17cm
      vertical_space_between_highlights: 0.24cm
      horizontal_space_between_bullet_and_highlight: 0.4em
      left_margin: 0.1cm

  # Overflow rescue — still readable.
  dense:
    text:
      font_size: 10pt
      leading: 0.56em
    section_titles:
      font_size: 1.22em
      vertical_space_above: 0.28cm
      vertical_space_below: 0.14cm
    entries:
      vertical_space_between_entries: 0.4em
      date_and_location_width: 3.35cm
      horizontal_space_between_columns: 0.09cm
      left_and_right_margin: 0.02cm
    highlights:
      top_margin: 0.12cm
      vertical_space_between_highlights: 0.15cm
      horizontal_space_between_bullet_and_highlight: 0.36em
      left_margin: 0.08cm

  # Last resort before hard content shrink.
  ultra_dense:
    header:
      vertical_space_between_name_and_connections: 0.22cm
      vertical_space_between_connections_and_first_section: 0.24cm
      horizontal_space_between_connections: 0.24cm
      name_font_size: 21pt
    text:
      font_size: 9.75pt
      leading: 0.52em
    section_titles:
      font_size: 1.18em
      vertical_space_above: 0.24cm
      vertical_space_below: 0.12cm
    entries:
      vertical_space_between_entries: 0.28em
      date_and_location_width: 3.3cm
      horizontal_space_between_columns: 0.08cm
      left_and_right_margin: 0.02cm
    highlights:
      top_margin: 0.1cm
      vertical_space_between_highlights: 0.12cm
      horizontal_space_between_bullet_and_highlight: 0.34em
      left_margin: 0.08cm
